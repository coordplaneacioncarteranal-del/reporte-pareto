<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reporte Pareto y Atraso Operativo &ndash; Departamento de Cartera | Jardines del Renacer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0d1f45;
      --az: #1a3a6e;
      --az2: #2356a8;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #cbd5e1;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 12.5px;
      line-height: 1.35;
      min-height: 100vh;
    }
    .topbar {
      background: linear-gradient(135deg, var(--navy) 0%, var(--az) 60%, var(--az2) 100%);
      color: #fff;
      padding: 14px 22px;
      box-shadow: 0 4px 18px rgba(13, 31, 69, 0.25);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-inner {
      max-width: 100%;
      width: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 42px; height: 42px; border-radius: 10px;
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .brand h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.2px; }
    .brand p { font-size: 0.76rem; color: #bfdbfe; margin-top: 2px; }
    .top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge-status {
      background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.25);
      padding: 6px 12px; border-radius: 999px; font-size: 0.74rem; font-weight: 600; color: #e0f2fe;
    }
    .btn {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
      border-radius: 8px; font-family: inherit; font-size: 0.78rem; font-weight: 700;
      border: none; cursor: pointer; text-decoration: none; white-space: nowrap; transition: all 0.15s;
    }
    .btn-green { background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; }
    .btn-green:hover { background: linear-gradient(135deg, #15803d, #166534); }
    .btn-outline-light { background: rgba(255,255,255,0.13); color: #fff; border: 1px solid rgba(255,255,255,0.3); }
    .btn-outline-light:hover { background: rgba(255,255,255,0.22); }

    .container { max-width: 100%; width: 100%; margin: 10px auto 24px; padding: 0 10px; }

    /* PESTAÑAS ESTILO EXCEL */
    .tabs-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 2px 10px;
      margin-bottom: 10px;
    }
    .tab-btn {
      padding: 9px 15px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #fff;
      color: #334155;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }
    .tab-btn:hover { border-color: var(--az2); color: var(--az); background: #eff6ff; }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--navy), var(--az2));
      color: #fff;
      border-color: var(--navy);
      box-shadow: 0 4px 12px rgba(26, 58, 110, 0.28);
    }

    /* BARRA DE BÚSQUEDA EN LA HOJA */
    .toolbar {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px 12px 0 0;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .toolbar-title { font-size: 0.92rem; font-weight: 800; color: var(--az); }
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-box input {
      padding: 7px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.8rem;
      width: 290px;
      max-width: 100%;
    }
    .search-box input:focus {
      outline: none;
      border-color: var(--az2);
      box-shadow: 0 0 0 3px rgba(35, 86, 168, 0.15);
    }

    /* CONTENEDOR DE TABLA EXCEL */
    .sheet-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-top: none;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      overflow: hidden;
    }
    .sheet-scroll {
      overflow: auto;
      max-height: calc(100vh - 205px);
      padding: 8px 10px;
      background: #fff;
    }
    table.xl-table {
      width: 100%;
      margin: 0 auto;
      border-collapse: collapse;
      font-size: 11.5px;
    }
    table.xl-table td {
      border: none;
      padding: 5px 6px;
      vertical-align: middle;
      text-align: center !important;
      white-space: nowrap;
    }
    table.xl-table td.has-val {
      border-bottom: 1px solid rgba(203, 213, 225, 0.45);
    }
    table.xl-table tr.spacer-row td {
      height: 12px;
      border: none;
      background: transparent;
      padding: 0;
    }
    table.xl-table tr:hover td {
      filter: brightness(0.97);
    }
    table.xl-table tr.hidden-row {
      display: none;
    }
    .wrap-text {
      white-space: normal !important;
      min-width: 150px;
      max-width: 340px;
    }
    td.sortable-th {
      cursor: pointer;
      user-select: none;
      transition: filter 0.12s;
    }
    td.sortable-th:hover {
      filter: brightness(0.92);
    }
    .sort-ind {
      display: inline-block;
      margin-left: 4px;
      font-size: 10px;
      opacity: 0.6;
    }
    tr.auto-subtotal-row td,
    tr[data-total="1"] td {
      background: #EBF3FC !important;
      color: #1A3A6E !important;
      font-weight: 800 !important;
      border-top: 2px solid #93c5fd !important;
      border-bottom: 2px solid #93c5fd !important;
    }
    td.sortable-th.sort-active .sort-ind {
      opacity: 1;
      color: #dc2626;
      font-weight: 900;
    }

    @media print {
      .topbar, .tabs-bar, .toolbar .search-box { display: none !important; }
      .sheet-scroll { max-height: none !important; overflow: visible !important; }
      @page { size: landscape; margin: 8mm; }
    }
  </style>
</head>

  </script>
  <script>
    let SHEETS_DATA = [];
    let ACTIVE_IDX = 0;

    async function descomprimirGzipB64(b64Str) {
      const binStr = atob(b64Str);
      const bytes = new Uint8Array(binStr.length);
      for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
      const ds = new DecompressionStream('gzip');
      const writer = ds.writable.getWriter();
      writer.write(bytes);
      writer.close();
      const text = await new Response(ds.readable).text();
      return JSON.parse(text);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      // Si se abre en web (https://), intentar cargar datos_pareto.json en vivo para actualización instantánea
      if (location.protocol.startsWith('http')) {
        try {
          const resp = await fetch(`https://raw.githubusercontent.com/coordplaneacioncarteranal-del/reporte-pareto/main/datos_pareto.json?t=${Date.now()}`, { cache: 'no-store' });
          if (resp.ok) {
            const payload = await resp.json();
            if (payload && payload.gzip_b64) {
              SHEETS_DATA = await descomprimirGzipB64(payload.gzip_b64);
              initApp(payload.meta);
              return;
            }
          }
        } catch (e) {
          console.warn('Usando respaldo incrustado:', e);
        }
      }

      if (window.PARETO_GZIP_B64) {
        SHEETS_DATA = await descomprimirGzipB64(window.PARETO_GZIP_B64);
        initApp(window.PARETO_META);
      }
    });

    function initApp(meta) {
      const fecha = meta && meta.generated_at ? meta.generated_at : '';
      document.getElementById('badge-meta').textContent = `✅ ${SHEETS_DATA.length} pestañas publicadas (${fecha})`;
      renderTabs();
      selectSheet(0);
    }

    function renderTabs() {
      const bar = document.getElementById('tabs-bar');
      bar.innerHTML = SHEETS_DATA.map((sh, idx) => `
        <button type="button" class="tab-btn ${idx === ACTIVE_IDX ? 'active' : ''}" onclick="selectSheet(${idx})">
          📑 ${escapeHtml(sh.name)}
        </button>
      `).join('');
    }

    function selectSheet(idx) {
      ACTIVE_IDX = idx;
      renderTabs();
      document.getElementById('q-buscar').value = '';
      renderSheetTable(SHEETS_DATA[idx]);
      document.getElementById('sheet-scroll').scrollTop = 0;
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderSheetTable(sheet) {
      document.getElementById('sheet-title').textContent = `📑 ${sheet.name}`;
      const tbody = document.getElementById('xl-tbody');
      const maxCol = sheet.max_col;

      const htmlRows = sheet.rows.map((row, rIdx) => {
        if (!row || row.length === 0) {
          return `<tr class="spacer-row" data-keep="1"><td colspan="${maxCol}"></td></tr>`;
        }

        // Mantener fijas en búsqueda las primeras filas de KPIs/Títulos (primeras 10 filas)
        const isHeaderArea = rIdx < 10 ? '1' : '0';

        // Si es un título de sección (solo la primera celda tiene texto y el resto de la fila está vacía y sin relleno),
        // expandir a todo el ancho de la tabla para que quede perfectamente centrado en una línea.
        const firstCell = row[0];
        const restEmpty = row.slice(1).every(x => x === null || ((x[0] || '') === '' && (x[1] || '') === ''));
        if (firstCell && (firstCell[0] || '') !== '' && restEmpty && !(firstCell[6] > 1) && !(firstCell[5] > 1)) {
          const txt = firstCell[0] || '';
          const bg = firstCell[1] || '';
          const fg = firstCell[2] || '#1a3a6e';
          const bgStyle = bg ? `background:${bg};` : '';
          const fgStyle = `color:${fg};`;
          return `<tr data-hdr="${isHeaderArea}"><td colspan="${maxCol}" style="${bgStyle}${fgStyle}font-weight:800;font-size:13px;padding:10px 12px;text-align:center !important;white-space:normal !important;border-bottom:2px solid #cbd5e1;">${escapeHtml(txt)}</td></tr>`;
        }

        // Detectar si es fila de encabezado de tabla (varias celdas con negrita y fondo de encabezado, sin merges grandes)
        const nonEmptyCells = row.filter(x => x !== null && (x[0] || '').trim() !== '');
        const hasBigMerge = row.some(x => x !== null && x[6] > 2);
        const boldBgCount = nonEmptyCells.filter(x => x[3] === 1 && (x[1] === '#EDF2F7' || x[1] === '#E2E8F0' || x[1] === '#1A3A6E' || x[1] === '#0D1F45' || x[1] === '#1E3A8A')).length;
        const isTableHdr = !hasBigMerge && nonEmptyCells.length >= 3 && boldBgCount >= 3;

        // Detectar si es fila de Total / Consolidado para dejarla fija al final al ordenar
        const first3Txt = row.slice(0, 3).map(x => x ? (x[0] || '').toUpperCase() : '').join(' ');
        const isTotalRow = /TOTAL|CONSOLIDADO/.test(first3Txt) || (nonEmptyCells.length >= 2 && nonEmptyCells.every(x => x[1] === '#EBF3FC' && x[3] === 1));

        let realColIdx = 0;
        const cellsHtml = row.map(c => {
          if (c === null) return ''; // Absorbida por rowspan/colspan
          const myCol = realColIdx;
          realColIdx += (c[6] > 1 ? c[6] : 1);

          const txt = c[0] || '';
          const bg = c[1] || '';
          const fg = c[2] || '';
          const bold = c[3] ? 'font-weight:700;' : '';
          const rs = c[5] > 1 ? ` rowspan="${c[5]}"` : '';
          const cs = c[6] > 1 ? ` colspan="${c[6]}"` : '';
          const bgStyle = bg ? `background:${bg};` : '';
          const fgStyle = fg ? `color:${fg};` : '';
          const wrapCls = txt.length > 42 ? 'wrap-text' : '';
          const valCls = (txt !== '' || bg !== '') ? 'has-val' : '';
          const sortCls = (isTableHdr && txt !== '') ? 'sortable-th' : '';
          const clsAttr = [wrapCls, valCls, sortCls].filter(Boolean).join(' ');
          const clsHtml = clsAttr ? ` class="${clsAttr}"` : '';
          const clickAttr = (isTableHdr && txt !== '') ? ` onclick="sortSubTable(this, ${myCol})" title="Clic para ordenar de Mayor a Menor / Menor a Mayor"` : '';
          const sortIcon = (isTableHdr && txt !== '') ? `<span class="sort-ind">⇅</span>` : '';
          return `<td${rs}${cs}${clsHtml}${clickAttr} data-col="${myCol}" style="${bgStyle}${fgStyle}${bold}">${escapeHtml(txt)}${sortIcon}</td>`;
        }).join('');

        return `<tr data-hdr="${isHeaderArea}" data-tbl-hdr="${isTableHdr ? '1' : '0'}" data-total="${isTotalRow ? '1' : '0'}">${cellsHtml}</tr>`;
      }).join('');

      tbody.innerHTML = htmlRows;
      recalcularSubtotalesTablas();
      document.getElementById('row-counter').textContent = `${sheet.rows.length.toLocaleString('es-CO')} filas`;
    }

    function filtrarTablaActiva() {
      const q = document.getElementById('q-buscar').value.trim().toUpperCase();
      const rows = document.querySelectorAll('#xl-tbody tr');
      let vis = 0;
      rows.forEach(tr => {
        if (!q || tr.getAttribute('data-hdr') === '1' || tr.getAttribute('data-keep') === '1' || tr.getAttribute('data-tbl-hdr') === '1' || tr.getAttribute('data-total') === '1') {
          tr.classList.remove('hidden-row');
          if (tr.getAttribute('data-keep') !== '1') vis++;
        } else {
          const txt = tr.textContent.toUpperCase();
          if (txt.includes(q)) {
            tr.classList.remove('hidden-row');
            vis++;
          } else {
            tr.classList.add('hidden-row');
          }
        }
      });
      recalcularSubtotalesTablas();
      document.getElementById('row-counter').textContent = `${vis.toLocaleString('es-CO')} filas visibles`;
    }

    function esColumnaNoSumable(hdrText) {
      const h = String(hdrText || '').toUpperCase().replace(/[⇅↓↑]/g, '').trim();
      if (!h) return true;
      const excl = [
        'RANKING', 'ACUM', 'PROMEDIO', 'TICKET', 'TELÉFONO', 'TELEFONO',
        'CONTRATO', 'ID', 'CÉDULA', 'CEDULA', 'FECHA', 'DÍAS ATRASO', 'DIAS ATRASO',
        'ATRASO (D', 'ANTIGÜEDAD', 'ANTIGUEDAD', 'ZONA PARETO', 'REGIONAL',
        'COBRADOR', 'ENTIDAD', 'TRAMO', 'NIVEL', 'DIAGNÓSTICO', 'DIAGNOSTICO',
        'CATEGORÍA', 'CATEGORIA', 'DESCRIPCIÓN', 'DESCRIPCION', 'CANAL', 'SEDE', 'CUOTAS PAG'
      ];
      return excl.some(k => h.includes(k));
    }

    function recalcularSubtotalesTablas() {
      const tbody = document.getElementById('xl-tbody');
      if (!tbody) return;
      const hdrRows = Array.from(tbody.querySelectorAll('tr[data-tbl-hdr="1"]'));

      hdrRows.forEach(hdrTr => {
        const dataRows = [];
        let totalTr = null;
        let cur = hdrTr.nextElementSibling;
        while (cur) {
          if (cur.getAttribute('data-total') === '1') {
            totalTr = cur;
            break;
          }
          if (
            cur.classList.contains('spacer-row') ||
            cur.getAttribute('data-tbl-hdr') === '1' ||
            (cur.children.length === 1 && cur.children[0].hasAttribute('colspan'))
          ) {
            break;
          }
          dataRows.push(cur);
          cur = cur.nextElementSibling;
        }
        if (dataRows.length === 0) return;

        // Si no existe fila de total para esta tabla, crear una automáticamente antes de `cur`
        if (!totalTr) {
          totalTr = document.createElement('tr');
          totalTr.className = 'auto-subtotal-row';
          totalTr.setAttribute('data-total', '1');
          Array.from(hdrTr.children).forEach((th, idx) => {
            const td = document.createElement('td');
            td.className = 'has-val';
            const colAttr = th.getAttribute('data-col');
            if (colAttr !== null) td.setAttribute('data-col', colAttr);
            if (idx === 0) td.textContent = 'SUBTOTAL';
            totalTr.appendChild(td);
          });
          tbody.insertBefore(totalTr, cur);
        }

        const visibleRows = dataRows.filter(r => !r.classList.contains('hidden-row'));
        const hdrCells = Array.from(hdrTr.children);

        hdrCells.forEach((th, idx) => {
          const colIdx = th.getAttribute('data-col') || String(idx);
          const hdrTxt = th.textContent || '';
          const targetTd = totalTr.querySelector(`td[data-col="${colIdx}"]`) || totalTr.children[idx];
          if (!targetTd) return;

          if (esColumnaNoSumable(hdrTxt)) {
            if (idx === 1 && !targetTd.textContent.trim() && !(totalTr.children[0] && totalTr.children[0].textContent.trim())) {
              targetTd.textContent = 'SUBTOTAL';
            }
            return;
          }

          let sum = 0;
          let countNum = 0;
          let isMoney = hdrTxt.includes('$');
          let isPct = hdrTxt.includes('%');

          visibleRows.forEach(tr => {
            const td = tr.querySelector(`td[data-col="${colIdx}"]`) || tr.children[idx];
            if (!td) return;
            const raw = td.textContent.trim();
            if (!raw) return;
            if (raw.includes('$')) isMoney = true;
            if (raw.includes('%')) isPct = true;
            const cleaned = raw.replace(/[$,%\s]/g, '').replace(/,/g, '');
            if (/^-?\d+(\.\d+)?$/.test(cleaned)) {
              sum += parseFloat(cleaned);
              countNum++;
            }
          });

          if (countNum > 0) {
            if (isPct) {
              targetTd.textContent = `${sum.toFixed(1)}%`;
            } else if (isMoney) {
              targetTd.textContent = '$' + Math.round(sum).toLocaleString('en-US');
            } else {
              targetTd.textContent = Math.round(sum).toLocaleString('en-US');
            }
            targetTd.classList.add('has-val');
          }
        });
      });
    }

    function parseSortValue(txt) {
      const s = String(txt || '').trim();
      if (!s) return { isNum: false, val: '' };
      // Detectar formatos como "$110,493,580", "15.6%", "3,540", "Día 15.1"
      let cleaned = s.replace(/^\s*D[ií]a\s+/i, '').replace(/[$,%\s]/g, '').replace(/,/g, '');
      if (/^-?\d+(\.\d+)?$/.test(cleaned)) {
        return { isNum: true, val: parseFloat(cleaned) };
      }
      return { isNum: false, val: s };
    }

    function sortSubTable(thEl, colIdx) {
      const hdrTr = thEl.closest('tr');
      if (!hdrTr) return;

      // Recoger las filas de datos pertenecientes a esta tabla hasta encontrar espacio, total u otro título/encabezado
      const dataRows = [];
      let cur = hdrTr.nextElementSibling;
      while (cur) {
        if (
          cur.classList.contains('spacer-row') ||
          cur.getAttribute('data-tbl-hdr') === '1' ||
          cur.getAttribute('data-total') === '1' ||
          (cur.children.length === 1 && cur.children[0].hasAttribute('colspan'))
        ) {
          break;
        }
        dataRows.push(cur);
        cur = cur.nextElementSibling;
      }
      if (dataRows.length <= 1) return;

      // Alternar orden: primera vez Mayor a Menor (desc), luego Menor a Mayor (asc)
      const prevDir = thEl.getAttribute('data-sort-dir');
      const dir = (prevDir === 'desc') ? 'asc' : 'desc';

      hdrTr.querySelectorAll('td.sortable-th').forEach(td => {
        td.removeAttribute('data-sort-dir');
        td.classList.remove('sort-active');
        const ind = td.querySelector('.sort-ind');
        if (ind) ind.textContent = '⇅';
      });
      thEl.setAttribute('data-sort-dir', dir);
      thEl.classList.add('sort-active');
      const indEl = thEl.querySelector('.sort-ind');
      if (indEl) indEl.textContent = (dir === 'desc') ? '↓' : '↑';

      const getCellText = (tr) => {
        const td = tr.querySelector(`td[data-col="${colIdx}"]`) || tr.children[colIdx];
        return td ? td.textContent.trim() : '';
      };

      dataRows.sort((a, b) => {
        const pa = parseSortValue(getCellText(a));
        const pb = parseSortValue(getCellText(b));
        let cmp = 0;
        if (pa.isNum && pb.isNum) {
          cmp = pa.val - pb.val;
        } else if (pa.isNum !== pb.isNum) {
          cmp = pa.isNum ? 1 : -1;
        } else {
          cmp = String(pa.val).localeCompare(String(pb.val), 'es', { numeric: true });
        }
        return dir === 'desc' ? -cmp : cmp;
      });

      const parent = hdrTr.parentNode;
      let refNode = hdrTr.nextElementSibling;
      // Insertar en orden justo después de hdrTr
      const frag = document.createDocumentFragment();
      dataRows.forEach(r => frag.appendChild(r));
      parent.insertBefore(frag, cur);
    }
  </script>
